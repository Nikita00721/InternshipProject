plugins {
    id 'java'
    id 'org.openapi.generator' version '7.2.0'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDir "$buildDir/generated-sources/swagger/src/main"
        }
    }
}

dependencies {
    annotationProcessor "org.projectlombok:lombok:1.18.30"
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    implementation "io.rest-assured:rest-assured:5.4.0"
    implementation "org.projectlombok:lombok:1.18.30"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.15.0"

    implementation group: 'org.openapitools', name: 'openapi-generator-gradle-plugin', version: '7.2.0'
    implementation group: 'com.google.code.gson', name: 'gson', version: '2.7'
    implementation "joda-time:joda-time:2.12.1"
}

test {
    useJUnitPlatform()
}

task openApiGenerateFront(type: org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    generatorName = "java"
    remoteInputSpec = "http://sb2frontend-altenar2-stage.biahosted.com/swagger/v1/swagger.json"
    outputDir.set("$buildDir/generated-sources/swagger")
    invokerPackage.set("")
    templateDir = "$projectDir/src/test/resources/templates"
    apiPackage.set("com.altenar.sb2.frontend.api")
    modelPackage.set("com.altenar.sb2.frontend.model")
    importMappings = ['FeedProvidersEnum': 'com.altenar.sb2.model.frontend.FeedProvidersEnum']
    configOptions = [dateLibrary                   : "joda",
                     serilalizationLibrary         : "jackson",
                     interfaceOnly                 : "true",
                     additionalModelTypeAnnotations: "@lombok.Data"
    ]
    library = "rest-assured"
    generateApiTests = false
    generateApiDocumentation = false
    generateModelTests = false
    generateModelDocumentation = false

    globalProperties = [models: ""]
}

task openApiGenerateAdmin(type: org.openapitools.generator.gradle.plugin.tasks.GenerateTask) {
    generatorName = "java"
    remoteInputSpec = "https://sb2admin-altenar2-stage.biahosted.com/swagger/v1/swagger.json"
    outputDir.set("$buildDir/generated-sources/swagger")
    invokerPackage.set("")
    templateDir = "$projectDir/src/test/resources/templates"
    apiPackage.set("com.altenar.sb2.admin.api")
    modelPackage.set("com.altenar.sb2.admin.model")
    importMappings = ['FeedProvidersEnum': 'com.altenar.sb2.model.admin.FeedProvidersEnum']
    configOptions = [dateLibrary                   : "joda",
                     serilalizationLibrary         : "jackson",
                     interfaceOnly                 : "true",
                     additionalModelTypeAnnotations: "@lombok.Data"
    ]
    library = "rest-assured"
    generateApiTests = false
    generateApiDocumentation = false
    generateModelTests = false
    generateModelDocumentation = false

    globalProperties = [models: ""]
}

task cleanBuildPublish(type: GradleBuild) {
    tasks = ['openApiGenerateFront', 'openApiGenerateAdmin']
}

compileJava.dependsOn tasks.cleanBuildPublish
